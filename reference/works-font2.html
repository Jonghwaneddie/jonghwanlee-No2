<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font 2 — Inter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body { font-family: 'Inter', sans-serif; font-size: 13px; color: #000; line-height: 1.6; }
        .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; background: #fff; z-index: 10; }
        .header-title { font-size: 14px; font-weight: 400; }
        .header-nav { display: flex; gap: 24px; font-size: 14px; }
        .header-nav span { color: #bbb; cursor: pointer; }
        .content { padding: 80px 40px 60px; max-width: 600px; }
        .font-label { font-size: 10px; color: #bbb; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; }
        .work-item { padding: 12px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: padding-left 0.3s; }
        .work-item:hover { padding-left: 8px; }
        .work-title { font-size: 18px; font-weight: 300; letter-spacing: -0.2px; }
        .work-year { font-size: 12px; color: #999; margin-top: 2px; }
        .work-desc { font-size: 12px; color: #aaa; margin-top: 4px; font-weight: 300; line-height: 1.7; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">Jonghwan Lee</div>
        <div class="header-nav"><span>Notes</span><span>CV</span><span>Works</span><span>Contact</span></div>
    </div>
    <div class="content">
        <div class="font-label">Font: Inter</div>
        <div class="work-item">
            <div class="work-title">The Respiration of Tectonic Joinery</div>
            <div class="work-year">2026</div>
            <div class="work-desc">Inhaling and Exhaling the Space</div>
        </div>
        <div class="work-item">
            <div class="work-title">The Bottom of the Wilderness</div>
            <div class="work-year">2025</div>
        </div>
        <div class="work-item">
            <div class="work-title">Tears</div>
            <div class="work-year">2025</div>
        </div>
        <div class="work-item">
            <div class="work-title">Narcissus</div>
            <div class="work-year">2023–2024</div>
        </div>
        <div class="work-item">
            <div class="work-title">Eyebeam & Pulse</div>
            <div class="work-year">2022–2023</div>
        </div>
        <div class="work-item">
            <div class="work-title">Filch</div>
            <div class="work-year">2020–2022</div>
        </div>
        <div class="work-item">
            <div class="work-title">Drawing</div>
            <div class="work-year">2020 –</div>
        </div>
    </div>
</body>
</html>
