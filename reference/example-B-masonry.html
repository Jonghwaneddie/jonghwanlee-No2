<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example B — Masonry Grid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        a { color: inherit; text-decoration: none; cursor: pointer; }
        body {
            font-family: 'Inter', sans-serif;
            font-size: 13px; color: #000; line-height: 1.6;
        }

        /* Header */
        .main-header {
            position: fixed; top: 0; left: 0; right: 0; height: 50px;
            padding: 0 30px; display: flex; align-items: center;
            justify-content: space-between; z-index: 100; background: #fff;
        }
        .top-text { font-size: 13px; white-space: nowrap; font-weight: 400; letter-spacing: -0.2px; }
        .top-links { display: flex; gap: 24px; }

        /* Masonry Grid */
        .main-view {
            padding: 65px 20px 40px;
        }

        .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #bbb;
            margin: 25px 0 12px;
            padding-left: 4px;
        }

        .masonry-grid {
            columns: 3;
            column-gap: 10px;
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .placeholder-img {
            width: 100%;
            background: #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 11px;
            font-weight: 300;
        }

        /* Vary heights for masonry effect */
        .masonry-item:nth-child(3n+1) .placeholder-img { aspect-ratio: 3 / 4; }
        .masonry-item:nth-child(3n+2) .placeholder-img { aspect-ratio: 4 / 3; }
        .masonry-item:nth-child(3n+3) .placeholder-img { aspect-ratio: 1 / 1; }

        /* Hover overlay — slide up from bottom */
        .masonry-overlay {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            padding: 20px 16px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .masonry-item:hover .masonry-overlay {
            transform: translateY(0);
        }
        .masonry-overlay-title {
            font-size: 15px;
            font-weight: 400;
            color: #fff;
            margin-bottom: 4px;
        }
        .masonry-overlay-info {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            font-weight: 300;
        }

        /* Gallery View */
        .gallery-view {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #fff; z-index: 200; flex-direction: column;
        }
        .gallery-view.active { display: flex; }
        .gallery-header {
            height: 50px; padding: 0 30px; display: flex;
            align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .gallery-back { font-size: 13px; cursor: pointer; transition: opacity 0.2s; font-weight: 300; }
        .gallery-back:hover { opacity: 0.4; }
        .gallery-title { font-size: 13px; text-align: center; flex: 1; font-weight: 300; }
        .gallery-counter { font-size: 11px; color: #999; min-width: 60px; text-align: right; }

        .gallery-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        .gallery-text-page {
            display: none; width: 100%; height: 100%;
            align-items: center; justify-content: center; padding: 40px;
        }
        .gallery-text-page.active { display: flex; }
        .gallery-text-content { max-width: 550px; font-size: 13px; line-height: 2; font-weight: 300; }

        .gallery-image-area {
            display: flex; width: 100%; height: 100%;
            align-items: center; justify-content: center; position: relative;
        }
        .gallery-image-area.hidden { display: none; }
        .gallery-image-area .placeholder-img {
            width: 400px; aspect-ratio: 4/3; background: #e8e8e8;
        }

        .gallery-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 28px; color: #ccc; cursor: pointer; padding: 20px;
            user-select: none; transition: color 0.2s; z-index: 10; font-weight: 300;
        }
        .gallery-nav:hover { color: #000; }
        .gallery-nav.prev { left: 0; }
        .gallery-nav.next { right: 0; }
        .gallery-nav.hidden { display: none; }

        .gallery-caption {
            padding: 15px 60px; text-align: left; font-size: 11px;
            color: #888; min-height: 45px; flex-shrink: 0; font-weight: 300;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .masonry-grid { columns: 2; }
            .gallery-nav { display: none; }
        }
        @media (max-width: 480px) {
            .masonry-grid { columns: 1; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="top-text"><a href="#">Jonghwan Lee</a></div>
        <div class="top-links">
            <div class="top-text"><a href="#">Notes</a></div>
            <div class="top-text"><a href="#">CV</a></div>
            <div class="top-text"><a href="#">Works</a></div>
            <div class="top-text"><a href="#">Contact</a></div>
        </div>
    </header>

    <div class="main-view" id="main-view">
        <div class="section-label" id="solo-label">Solo</div>
        <div class="masonry-grid" id="solo-grid"></div>
        <div class="section-label" id="group-label">Group</div>
        <div class="masonry-grid" id="group-grid"></div>
    </div>

    <!-- Gallery -->
    <div class="gallery-view" id="gallery-view">
        <div class="gallery-header">
            <span class="gallery-back" id="gallery-back">&larr; Back</span>
            <span class="gallery-title" id="gallery-title"></span>
            <span class="gallery-counter" id="gallery-counter"></span>
        </div>
        <div class="gallery-body">
            <div class="gallery-text-page" id="gallery-text-page">
                <div class="gallery-text-content" id="gallery-text-content"></div>
            </div>
            <div class="gallery-image-area" id="gallery-image-area">
                <div class="gallery-nav prev" id="gallery-prev">&#10094;</div>
                <div class="placeholder-img">Image Placeholder</div>
                <div class="gallery-nav next" id="gallery-next">&#10095;</div>
            </div>
        </div>
        <div class="gallery-caption" id="gallery-caption"></div>
    </div>

    <script>
        const exhibitions = [
            { id: 'Loggia', type: 'solo', title: 'Loggia', year: '2025', info: 'Hall1, Seoul', imageCount: 34 },
            { id: 'Hypercube', type: 'solo', title: 'Hypercube', year: '2023', info: 'CYLINDER TWO, Seoul', imageCount: 23 },
            { id: 'Cabinet', type: 'solo', title: 'Cabinet', year: '2023', info: 'Sahangup gallery, Seoul', imageCount: 14 },
            { id: 'Expanding Horizons', type: 'group', title: 'Expanding Horizons', year: '2026', info: 'Korean Cultural Center, Hong Kong', imageCount: 7 },
            { id: 'grid 5', type: 'group', title: 'grid 5', year: '2026', info: 'biscuit gallery, Tokyo', imageCount: 5 },
            { id: 'Surgical Room', type: 'group', title: 'Surgical Room', year: '2025', info: 'CYLINDER TWO, Seoul', imageCount: 6 },
            { id: 'South Parade', type: 'group', title: 'CYLINDER x South Parade', year: '2024', info: 'South Parade, London', imageCount: 6 },
            { id: 'The Good Neighbor', type: 'group', title: 'The Good Neighbor', year: '2023', info: 'Art Space 3, Seoul', imageCount: 10 },
            { id: 'The Wild Bunch', type: 'group', title: 'The Wild Bunch', year: '2022', info: 'ThisWeekendRoom, Seoul', imageCount: 4 },
            { id: 'Fonds', type: 'group', title: 'Fonds', year: '2022', info: 'Osisun, Seoul', imageCount: 7 },
            { id: 'Room of Convexity', type: 'group', title: 'Room of Convexity and Concavity', year: '2022', info: 'LaLaLab, Seoul', imageCount: 23 },
            { id: 'TORQUE 1', type: 'group', title: 'TORQUE 1 / GEAR SHIFT', year: '2021', info: 'CYLINDER ONE, Seoul', imageCount: 4 },
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const soloGrid = document.getElementById('solo-grid');
            const groupGrid = document.getElementById('group-grid');
            const mainView = document.getElementById('main-view');
            const galleryView = document.getElementById('gallery-view');
            const galleryTitle = document.getElementById('gallery-title');
            const galleryCounter = document.getElementById('gallery-counter');
            const galleryCaption = document.getElementById('gallery-caption');
            const galleryBack = document.getElementById('gallery-back');
            const galleryPrev = document.getElementById('gallery-prev');
            const galleryNext = document.getElementById('gallery-next');
            const galleryImageArea = document.getElementById('gallery-image-area');
            const galleryTextPage = document.getElementById('gallery-text-page');
            const galleryTextContent = document.getElementById('gallery-text-content');

            let currentEx = null, currentIndex = 0, totalSlides = 0;

            function createCard(ex) {
                const item = document.createElement('div');
                item.className = 'masonry-item';
                item.innerHTML = `
                    <div class="placeholder-img">${ex.title}</div>
                    <div class="masonry-overlay">
                        <div class="masonry-overlay-title">${ex.title}</div>
                        <div class="masonry-overlay-info">${ex.year} — ${ex.info}</div>
                    </div>
                `;
                item.addEventListener('click', () => openGallery(ex));
                return item;
            }

            exhibitions.filter(e => e.type === 'solo').forEach(ex => soloGrid.appendChild(createCard(ex)));
            exhibitions.filter(e => e.type === 'group').forEach(ex => groupGrid.appendChild(createCard(ex)));

            function openGallery(ex) {
                currentEx = ex;
                currentIndex = 0;
                totalSlides = ex.imageCount + 1;
                galleryTitle.textContent = ex.title;
                updateGallery();
                galleryView.classList.add('active');
                mainView.style.display = 'none';
                document.body.style.overflow = 'hidden';
            }

            function closeGallery() {
                galleryView.classList.remove('active');
                mainView.style.display = '';
                document.body.style.overflow = '';
            }

            function isTextSlide(ex, idx) {
                return ex.type === 'solo' ? idx === 0 : idx === ex.imageCount;
            }

            function updateGallery() {
                galleryCounter.textContent = `${currentIndex + 1} / ${totalSlides}`;
                galleryPrev.classList.toggle('hidden', currentIndex === 0);
                galleryNext.classList.toggle('hidden', currentIndex === totalSlides - 1);
                if (isTextSlide(currentEx, currentIndex)) {
                    galleryTextPage.classList.add('active');
                    galleryImageArea.classList.add('hidden');
                    galleryCaption.textContent = '';
                    galleryTextContent.innerHTML = `<div style="font-size:16px;margin-bottom:12px;">${currentEx.title}</div><div style="color:#999;font-size:12px;">${currentEx.year} — ${currentEx.info}</div><br><div>(텍스트 추후 입력)</div>`;
                } else {
                    galleryTextPage.classList.remove('active');
                    galleryImageArea.classList.remove('hidden');
                    const imgIdx = currentEx.type === 'solo' ? currentIndex - 1 : currentIndex;
                    galleryCaption.textContent = `Image ${imgIdx + 1} / ${currentEx.imageCount}`;
                }
            }

            function navigate(dir) {
                const n = currentIndex + dir;
                if (n >= 0 && n < totalSlides) { currentIndex = n; updateGallery(); }
            }

            galleryBack.addEventListener('click', closeGallery);
            galleryPrev.addEventListener('click', () => navigate(-1));
            galleryNext.addEventListener('click', () => navigate(1));
            document.addEventListener('keydown', (e) => {
                if (!galleryView.classList.contains('active')) return;
                if (e.key === 'Escape') closeGallery();
                if (e.key === 'ArrowLeft') navigate(-1);
                if (e.key === 'ArrowRight') navigate(1);
            });
        });
    </script>
</body>
</html>
