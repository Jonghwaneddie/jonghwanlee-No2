<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonghwan Lee</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        a { color: inherit; text-decoration: none; cursor: pointer; }
        body { font-family: 'Raleway', sans-serif; font-size: 13px; color: #000; line-height: 1.6; }
        .fade-text { color: #bbb; }

        /* ===== Header ===== */
        .header { position: fixed; top: 0; left: 0; right: 0; padding: 0; background: #fff; z-index: 100; }
        .header-row { height: 50px; display: flex; align-items: center; }
        .header-title { font-size: 13px; font-weight: 300; letter-spacing: 1px; flex-shrink: 0; padding-left: 20px; }
        .header-nav { display: flex; align-items: center; justify-content: flex-end; flex: 1; font-size: 12px; font-weight: 200; letter-spacing: 0.5px; }
        .header-nav a { flex: 1; text-align: center; color: #999; text-decoration: none; transition: color 0.2s; }
        .header-nav a:hover { color: #000; }
        .hamburger { display: none; position: absolute; right: 20px; top: 12px; width: 20px; height: 16px; cursor: pointer; flex-direction: column; justify-content: space-between; }
        .hamburger span { display: block; height: 1px; background: #000; transition: transform 0.3s, opacity 0.3s; }
        .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
        .mobile-menu { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fff; z-index: 99; flex-direction: column; align-items: center; justify-content: center; gap: 25px; }
        .mobile-menu.open { display: flex; }
        .mobile-menu a { font-size: 16px; font-weight: 200; color: #000; text-decoration: none; letter-spacing: 1px; transition: opacity 0.2s; }
        .mobile-menu a:hover { opacity: 0.3; }

        /* ===== Main View: 2-Column Grid ===== */
        .main-view {
            padding: 60px 20px 60px;
        }

        .exhibition-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-width: 100%;
            margin: 0 auto;
        }

        .section-label {
            grid-column: 1 / -1;
            font-size: 12px;
            color: #999;
            padding: 20px 0 5px;
        }
        .section-label:first-child { padding-top: 0; }

        .exhibition-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .placeholder-img {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .placeholder-img img {
            width: 50%;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        /* Hover overlay */
        .exhibition-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: saturate(120%) blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .exhibition-item:hover .exhibition-overlay { opacity: 1; }

        .exhibition-overlay-text {
            text-align: center;
            font-size: 13px;
            line-height: 1.8;
            color: #000;
            padding: 30px;
        }
        .exhibition-overlay-title { font-size: 1.6vw; margin-bottom: 4px; font-weight: 300; }
        .exhibition-overlay-year { font-size: 1vw; color: #333; font-weight: 200; }

        .empty-cell { visibility: visible; }

        /* ===== Gallery View ===== */
        .gallery-view {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #fff; z-index: 200; flex-direction: column;
        }
        .gallery-view.active { display: flex; }

        .gallery-header {
            height: 50px; padding: 0 20px; display: flex;
            align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .gallery-back { font-size: 14px; cursor: pointer; transition: opacity 0.2s; }
        .gallery-back:hover { opacity: 0.4; }
        .gallery-title { font-size: 14px; text-align: center; flex: 1; }
        .gallery-counter { font-size: 12px; color: #999; min-width: 60px; text-align: right; }

        .gallery-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        /* Image area */
        .gallery-image-area {
            flex: 1; display: flex;
            width: 100%; height: 100%;
            align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        .gallery-image-area img {
            max-width: calc(100% - 120px); max-height: calc(100% - 40px);
            object-fit: contain; transition: opacity 0.15s ease-in-out;
        }

        /* Info overlay (like works.html) */
        .gallery-info-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9); z-index: 5;
            display: flex; align-items: center; justify-content: center;
            opacity: 1; transition: opacity 0.3s ease; pointer-events: none;
        }
        .gallery-info-overlay.hidden { opacity: 0; }
        .gallery-info-overlay-content {
            max-width: 500px; padding: 40px 30px;
            font-size: 13px; line-height: 2;
            text-align: center; color: #000; font-weight: 200;
        }

        .gallery-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 36px; color: #ccc; cursor: pointer; padding: 20px;
            user-select: none; transition: color 0.2s; z-index: 10;
        }
        .gallery-nav:hover { color: #000; }
        .gallery-nav.prev { left: 0; }
        .gallery-nav.next { right: 0; }
        .gallery-nav.hidden { display: none; }

        .gallery-caption {
            padding: 15px 60px; text-align: left; font-size: 12px;
            color: #666; min-height: 50px; flex-shrink: 0;
        }

        /* ===== Mobile ===== */
        @media (max-width: 768px) {
            .main-view { padding: 60px 15px 40px; }
            .exhibition-grid { grid-template-columns: 1fr; }
            .header-nav { display: none; }
            .hamburger { display: flex; }
            .exhibition-overlay-title { font-size: 16px; }
            .exhibition-overlay-year { font-size: 13px; }
            .exhibition-overlay { opacity: 1; background: rgba(255,255,255,0.15); backdrop-filter: none; }
            .exhibition-overlay-text { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.5); font-size: 12px; }
            .gallery-image-area img { max-width: calc(100% - 20px); max-height: calc(100% - 20px); }
            .gallery-nav { display: none; }
        }
    </style>

                info: '2025. 7. 31 ~ 2025. 8. 23<br>Hall1, 8, Yangpyeong-ro 22ma-gil, Yeongdeungpo-gu, Seoul, Korea',
                description: '<span class="fade-text">Text by Soomin Lee<br>Poster by Jungin Won<br>Installation by Alwayslastdanceclub<br>Photography by San Choi<br>Support by Bongkyun Kwon, Gayoon Yong, Anha Lee<br><br>Supported by Seoul Foundation for Arts and Culture</span><br><br>해방된 기둥이 있다. 구역을 만들어내는 기둥은 중심에서 장소를 구체화하고 있지만 그 무엇도 지지하지 않고 있다. 정확히는 어디를 지지하고 있는지 말할 수 없다. 기둥의 끝에서 빛이 솟아오른다. 기둥은 저기 있지만 빛은 다가와 마주침을 만들어낸다. 기둥과 빛은 보이지 않는 것을 마주하기 위해 공간과 시간을 뒤섞어 지금 이 자리에 있음을 느끼게 한다. 그곳은 재현되는 것이 아니라 스스로를 드러낸다. 기둥 속에서 반짝이는 추는 반복되는 소리를 흘려보낸다. 그 소리는 이곳이 우리와 또 다른 것임을 알려주는 듯하다.<br><br>A liberated pillar stands. Creating a distinct zone, the pillar gives substance to the space from its center, yet supports nothing. Precisely where it lends its support is undefinable. Light springs forth from the pillar\'s apex. The pillar remains distant, but the light approaches to orchestrate an encounter. The place does not merely reproduce; it reveals itself. Within the pillar, a shimmering pendulum releases a repeating sound. That sound seems to suggest this space is fundamentally separate from us.',

            {
                id: 'Hypercube', type: 'solo', title: 'Hypercube', year: '2023',
                info: '2023. 7. 8 ~ 2023. 8. 13<br>CYLINDER TWO, 24, Hangang-daero 48-gil, Yongsan-gu, Seoul, Korea',
                description: '<span class="fade-text">Supported by Seoul Foundation for Arts and Culture</span><br><br>인간의 지각 이전에 회화 자체의 지각이 역으로 생기를 발생시킬 수 있다는 가설과 함께, 지속적으로 형성되는 지각의 순환구조에서 작용하는 회화 속 물질들의 압축된 세계를 탐구한다. 그의 회화를 담아 내는 화판은 단순히 안료가 안착되는 표면이 아닌 회화로부터 파생된 존재들이 거주하며 회화의 확장성을 이끌어내는 유기적인 육면체이자 소우주이다. 화판의 표면에 그려진 회화는 음각으로 생겨난 균열을 통해 2차원과 3차원의 경계 사이에 머무르고, 나무의 깎인 자국이 만든 계곡과 그 주변의 풍경들은 캐스팅을 통해 물과 하얀 가루의 화학반응으로 만들어진 고체의 표면으로 서서히 이동한다. 그리고 정지해 있는 회화 및 석고와 달리 화판 내부에 식립된 진자는 주기운동을 통해 서로가 맞닿으며 미세한 파동을 일으키는데, 이 청각적인 진동을 동반한 추의 위치변화는 시계의 초침처럼 정지해있는 대상에 시간성을 부여하고, 이는 다시 석고를 매질 삼아 회화의 표면으로 도달해 그 주위로 흐르는 시간에 대한 고찰을 이끈다.<br><br>Jonghwan Lee delves into the condensed world of painting materials that exist within the continuously forming cyclical structure of perception based on the hypothesis that the perception of painting itself can generate vitality even prior to human perception. The wood panel that encapsulates his paintings goes beyond being a mere surface for pigments to settle and takes the form of an organic hexahedron and a microcosm inhabited by entities that originate from the paintings and lead to their extension. The carved traces on wood that create valleys and the surrounding landscapes gradually transition into solid surfaces through casting, facilitated by chemical reactions between water and white powder. Furthermore, a pendulum embedded within the panel undergoes periodic motion, colliding and creating waves. The pendulum\'s positional shifts, accompanied by auditory vibrations, infuse a sense of temporality into the stationary subjects, akin to the movement of a clock\'s second hand. This, in turn, reaches the surface of the paintings using plaster as a medium, prompting contemplation on the passage of time.',

                description: '<span class="fade-text">Poster by Hanbyul Joo<br>Installation by Alwayslastdanceclub<br>Photography by SES</span><br><br>\'Cabinet\'은 단순한 수납 구조가 아니라, 보이지 않는 것을 수집하고 보존하는 장소, 나아가 회화를 기록하는 새로운 방식에 대한 탐색의 장으로 제안된다. 고대의 \'호기심의 방(Wunderkammer)\'이 세계의 단면을 수집하고 배열하며 하나의 인식 구조를 만들어냈듯, 이 전시에서의 캐비닛은 회화를 감각적으로 기록하고 물리적으로 저장하는 장소로 작동한다. 기존의 사진 매체는 회화를 납작한 이미지로 환원시키며, 지지체의 물질성, 화면의 구조, 시간성과 같은 회화의 본질적 요소를 배제한다. 이에 반해, 프로타주는 회화와의 신체적 접촉을 통해 그 표면 너머의 두께, 굴곡, 질감, 잔여 정보 등을 비시각적 감각으로 기록하는 방식으로 기능한다. 이는 회화를 단순한 이미지가 아닌, 기록 가능한 물질이자 접촉 가능한 사건으로 인식하게 하며, 회화와 기록, 이미지와 구조 사이의 간극을 새롭게 사유하게 한다.<br><br>Cabinet is presented not merely as a structure for storage, but as a space for collecting and preserving what is invisible — a platform for exploring new methods of recording painting. Just as the historical Wunderkammer (cabinet of curiosities) gathered fragments of the world and organized them into a system of knowledge, the cabinet in this exhibition functions as a site for sensory recording and material archiving of painting. While traditional photography flattens painting into an image, excluding its material substrate, structural depth, and temporality, frottage offers an alternative approach. Through physical contact with the surface, frottage captures what lies beyond the visible — the thickness, texture, contours, and residual information of the work. In this context, painting is no longer approached merely as an image, but as a recordable material and a tactile event, opening a space to reflect on the gaps between painting and documentation, image and structure.',

        // ===== App Logic =====
        document.addEventListener('DOMContentLoaded', () => {
            const mainView = document.getElementById('main-view');
            const gridEl = document.getElementById('exhibition-grid');
            const galleryView = document.getElementById('gallery-view');
            const galleryTitle = document.getElementById('gallery-title');
            const galleryCounter = document.getElementById('gallery-counter');
            const galleryCaption = document.getElementById('gallery-caption');
            const galleryBack = document.getElementById('gallery-back');
            const galleryPrev = document.getElementById('gallery-prev');
            const galleryNext = document.getElementById('gallery-next');
            const galleryImageArea = document.getElementById('gallery-image-area');
            const galleryImg = document.getElementById('gallery-img');
            const galleryInfoOverlay = document.getElementById('gallery-info-overlay');
            const galleryInfoOverlayContent = document.getElementById('gallery-info-overlay-content');

            let currentExhibition = null;
            let currentImages = [];
            let currentIndex = 0;
            let overlayShowing = false;

            // --- Build Grid ---
            const solos = exhibitions.filter(e => e.type === 'solo');
            const groups = exhibitions.filter(e => e.type === 'group');

            // Solo label
            const soloLabel = document.createElement('div');
            soloLabel.className = 'section-label';
            soloLabel.textContent = 'Solo Exhibitions';
            gridEl.appendChild(soloLabel);

            // Solo items
            solos.forEach(ex => gridEl.appendChild(createExhibitionCell(ex)));

            // If solo count is odd, add empty cell
            if (solos.length % 2 !== 0) {
                const empty = document.createElement('div');
                empty.className = 'exhibition-item empty-cell';
                empty.innerHTML = '<div class="placeholder-img"><img src="/line.jpg" alt="line placeholder"></div>';
                gridEl.appendChild(empty);
            }

            // Group label
            const groupLabel = document.createElement('div');
            groupLabel.className = 'section-label';
            groupLabel.textContent = 'Group Exhibitions';
            gridEl.appendChild(groupLabel);

            // Group items
            groups.forEach(ex => gridEl.appendChild(createExhibitionCell(ex)));

            // If group count is odd, add empty cell
            if (groups.length % 2 !== 0) {
                const empty = document.createElement('div');
                empty.className = 'exhibition-item empty-cell';
                empty.innerHTML = '<div class="placeholder-img"><img src="/line.jpg" alt="line placeholder"></div>';
                gridEl.appendChild(empty);
            }

            function createExhibitionCell(ex) {
                const item = document.createElement('div');
                item.className = 'exhibition-item';
                const firstImg = allImageData.find(d => d.projectId === ex.id && !d.isDefault);
                const imgUrl = firstImg ? firstImg.url : '';
                item.innerHTML = `
                    <img src="${imgUrl}" alt="${ex.title}" style="width:100%; aspect-ratio:4/3; object-fit:cover; display:block;">
                    <div class="exhibition-overlay">
                        <div class="exhibition-overlay-text">
                            <div class="exhibition-overlay-title">${ex.title}</div>
                            <div class="exhibition-overlay-year">${ex.year}</div>
                        </div>
                    </div>
                `;
                item.addEventListener('click', () => openGallery(ex));
                return item;
            }

            // --- Gallery (overlay style, like works.html) ---
            function getExhibitionImages(ex) {
                return allImageData.filter(d => d.projectId === ex.id && !d.isDefault);
            }

            function getOverlayHTML(ex) {
                const info = `<div style="margin-bottom:15px; color:#999;">${ex.info}</div>`;
                const detail = ex.type === 'solo' ? ex.description : (ex.artists || '');
                return info + '<div>' + detail + '</div>';
            }

            function updateGallery() {
                const img = currentImages[currentIndex];
                if (!img) return;
                const loader = new Image();
                loader.onload = () => { galleryImg.src = loader.src; galleryImg.alt = img.description || ''; };
                loader.src = img.url;
                galleryCaption.textContent = img.description || '';
                galleryCounter.textContent = `${currentIndex + 1} / ${currentImages.length}`;
                galleryPrev.classList.toggle('hidden', currentIndex === 0);
                galleryNext.classList.toggle('hidden', currentIndex === currentImages.length - 1);
                if (overlayShowing) { galleryInfoOverlay.classList.remove('hidden'); }
                else { galleryInfoOverlay.classList.add('hidden'); }
            }

            function openGallery(ex) {
                currentExhibition = ex;
                currentImages = getExhibitionImages(ex);
                currentIndex = 0;
                overlayShowing = true;
                galleryTitle.textContent = ex.title;
                galleryInfoOverlayContent.innerHTML = getOverlayHTML(ex);
                galleryInfoOverlay.classList.remove('hidden');
                updateGallery();
                galleryView.classList.add('active');
                mainView.style.display = 'none';
                document.body.style.overflow = 'hidden';
                history.pushState({ gallery: true }, '', '#' + encodeURIComponent(ex.id));
            }

            function closeGallery() {
                galleryView.classList.remove('active');
                mainView.style.display = '';
                document.body.style.overflow = '';
                if (history.state && history.state.gallery) history.back();
            }

            function navigate(dir) {
                if (overlayShowing && dir === 1) {
                    overlayShowing = false;
                    galleryInfoOverlay.classList.add('hidden');
                    return;
                }
                const n = currentIndex + dir;
                if (n >= 0 && n < currentImages.length) {
                    currentIndex = n;
                    updateGallery();
                }
            }

            galleryBack.addEventListener('click', closeGallery);
            galleryPrev.addEventListener('click', () => navigate(-1));
            galleryNext.addEventListener('click', () => navigate(1));

            document.addEventListener('keydown', (e) => {
                if (!galleryView.classList.contains('active')) return;
                if (e.key === 'Escape') closeGallery();
                if (e.key === 'ArrowLeft') navigate(-1);
                if (e.key === 'ArrowRight') navigate(1);
            });

            // Mobile tap navigation
            galleryImageArea.addEventListener('click', (e) => {
                if (window.innerWidth > 768) return;
                const rect = galleryImageArea.getBoundingClientRect();
                const x = e.clientX - rect.left;
                if (x < rect.width / 3) navigate(-1);
                else if (x > rect.width * 2 / 3) navigate(1);
            });

            window.addEventListener('popstate', () => {
                if (galleryView.classList.contains('active')) {
                    galleryView.classList.remove('active');
                    mainView.style.display = '';
                    document.body.style.overflow = '';
                }
            });

            // Hamburger
            const hamburger = document.getElementById('hamburger');
            const mobileMenu = document.getElementById('mobile-menu');
            hamburger.addEventListener('click', () => { hamburger.classList.toggle('open'); mobileMenu.classList.toggle('open'); });
            document.querySelectorAll('.mobile-link').forEach(l => l.addEventListener('click', () => { hamburger.classList.remove('open'); mobileMenu.classList.remove('open'); }));
        });
    </script>
