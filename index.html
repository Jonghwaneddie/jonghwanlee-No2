<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonghwan Lee</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        a { color: inherit; text-decoration: none; cursor: pointer; }
        body { font-family: 'Raleway', sans-serif; font-size: 13px; color: #000; line-height: 1.6; }
        .fade-text { color: #bbb; }

        /* ===== Header ===== */
        .header { position: fixed; top: 0; left: 0; right: 0; padding: 0; background: #fff; z-index: 100; }
        .header-row { height: 50px; display: flex; align-items: center; }
        .header-title { font-size: 13px; font-weight: 300; letter-spacing: 1px; flex-shrink: 0; padding-left: 20px; }
        .header-nav { display: flex; align-items: center; justify-content: flex-end; flex: 1; font-size: 12px; font-weight: 200; letter-spacing: 0.5px; }
        .header-nav a { flex: 1; text-align: center; color: #999; text-decoration: none; transition: color 0.2s; }
        .header-nav a:hover { color: #000; }
        .hamburger { display: none; position: absolute; right: 20px; top: 12px; width: 20px; height: 16px; cursor: pointer; flex-direction: column; justify-content: space-between; }
        .hamburger span { display: block; height: 1px; background: #000; transition: transform 0.3s, opacity 0.3s; }
        .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
        .mobile-menu { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fff; z-index: 99; flex-direction: column; align-items: center; justify-content: center; gap: 25px; }
        .mobile-menu.open { display: flex; }
        .mobile-menu a { font-size: 16px; font-weight: 200; color: #000; text-decoration: none; letter-spacing: 1px; transition: opacity 0.2s; }
        .mobile-menu a:hover { opacity: 0.3; }

        /* ===== Main View: 2-Column Grid ===== */
        .main-view {
            padding: 60px 20px 60px;
        }

        .exhibition-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-width: 100%;
            margin: 0 auto;
        }

        .section-label {
            grid-column: 1 / -1;
            font-size: 12px;
            color: #999;
            padding: 20px 0 5px;
        }
        .section-label:first-child { padding-top: 0; }

        .exhibition-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .placeholder-img {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 11px;
        }

        /* Hover overlay */
        .exhibition-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: saturate(120%) blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .exhibition-item:hover .exhibition-overlay { opacity: 1; }

        .exhibition-overlay-text {
            text-align: center;
            font-size: 13px;
            line-height: 1.8;
            color: #000;
            padding: 30px;
        }
        .exhibition-overlay-title { font-size: 1.6vw; margin-bottom: 4px; font-weight: 300; }
        .exhibition-overlay-year { font-size: 1vw; color: #333; font-weight: 200; }

        .empty-cell { visibility: hidden; }

        /* ===== Gallery View ===== */
        .gallery-view {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #fff; z-index: 200; flex-direction: column;
        }
        .gallery-view.active { display: flex; }

        .gallery-header {
            height: 50px; padding: 0 20px; display: flex;
            align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .gallery-back { font-size: 14px; cursor: pointer; transition: opacity 0.2s; }
        .gallery-back:hover { opacity: 0.4; }
        .gallery-title { font-size: 14px; text-align: center; flex: 1; }
        .gallery-counter { font-size: 12px; color: #999; min-width: 60px; text-align: right; }

        .gallery-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        /* Text page (solo intro / group artists) */
        .gallery-text-page {
            display: none;
            width: 100%; height: 100%;
            align-items: center; justify-content: center;
            padding: 40px;
        }
        .gallery-text-page.active { display: flex; }
        .gallery-text-content {
            max-width: 600px;
            font-size: 13px;
            line-height: 2;
            text-align: left;
        }

        /* Image area */
        .gallery-image-area {
            display: flex;
            width: 100%; height: 100%;
            align-items: center; justify-content: center;
            position: relative;
        }
        .gallery-image-area.hidden { display: none; }

        .gallery-image-area .placeholder-img {
            max-width: calc(100% - 120px);
            max-height: calc(100% - 40px);
            width: auto; height: auto;
            aspect-ratio: 4 / 3;
            min-width: 400px;
            min-height: 300px;
        }

        .gallery-image-area img {
            max-width: calc(100% - 120px); max-height: calc(100% - 40px);
            object-fit: contain; transition: opacity 0.15s ease-in-out;
            display: none;
        }

        .gallery-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 36px; color: #ccc; cursor: pointer; padding: 20px;
            user-select: none; transition: color 0.2s; z-index: 10;
        }
        .gallery-nav:hover { color: #000; }
        .gallery-nav.prev { left: 0; }
        .gallery-nav.next { right: 0; }
        .gallery-nav.hidden { display: none; }

        .gallery-caption {
            padding: 15px 60px; text-align: left; font-size: 12px;
            color: #666; min-height: 50px; flex-shrink: 0;
        }

        /* ===== Mobile ===== */
        @media (max-width: 768px) {
            .main-view { padding: 60px 15px 40px; }
            .exhibition-grid { grid-template-columns: 1fr; }
            .empty-cell { display: none; }
            .header-nav { display: none; }
            .hamburger { display: flex; }
            .exhibition-overlay-title { font-size: 16px; }
            .exhibition-overlay-year { font-size: 13px; }
            .exhibition-overlay { opacity: 1; background: rgba(255,255,255,0.15); backdrop-filter: none; }
            .exhibition-overlay-text { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.5); font-size: 12px; }
            .gallery-image-area .placeholder-img { max-width: calc(100% - 20px); min-width: 200px; min-height: 150px; }
            .gallery-nav { display: none; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-row">
            <div class="header-title"><a href="index.html">Jonghwan Lee</a></div>
            <nav class="header-nav">
                <a href="note.html">Notes</a>
                <a href="cv.html">CV</a>
                <a href="works.html">Works</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </header>
    <div class="mobile-menu" id="mobile-menu">
        <a href="note.html" class="mobile-link">Notes</a>
        <a href="cv.html" class="mobile-link">CV</a>
        <a href="works.html" class="mobile-link">Works</a>
        <a href="contact.html" class="mobile-link">Contact</a>
    </div>

    <div class="main-view" id="main-view">
        <div class="exhibition-grid" id="exhibition-grid"></div>
    </div>

    <!-- Gallery View -->
    <div class="gallery-view" id="gallery-view">
        <div class="gallery-header">
            <span class="gallery-back" id="gallery-back">&larr; Back</span>
            <span class="gallery-title" id="gallery-title"></span>
            <span class="gallery-counter" id="gallery-counter"></span>
        </div>
        <div class="gallery-body">
            <div class="gallery-text-page" id="gallery-text-page">
                <div class="gallery-text-content" id="gallery-text-content"></div>
            </div>
            <div class="gallery-image-area" id="gallery-image-area">
                <div class="gallery-nav prev" id="gallery-prev">&#10094;</div>
                <div class="placeholder-img" id="gallery-placeholder">Image Placeholder</div>
                <img id="gallery-img" src="" alt="" style="display:none;">
                <div class="gallery-nav next" id="gallery-next">&#10095;</div>
            </div>
        </div>
        <div class="gallery-caption" id="gallery-caption"></div>
    </div>

    <script>
        // ===== Exhibition Data =====
        const exhibitions = [
            // --- Solo ---
            {
                id: 'Loggia', type: 'solo', title: 'Loggia', year: '2025',
                info: '2025. 7. 31 ~ 2025. 8. 23<br>Hall1, Seoul, Korea',
                description: '(Loggia 전시 설명 텍스트 — 추후 입력)',
                imageCount: 34
            },
            {
                id: 'Hypercube', type: 'solo', title: 'Hypercube', year: '2023',
                info: '2023. 7. 8 ~ 2023. 8. 13<br>CYLINDER TWO, Seoul, Korea',
                description: '(Hypercube 전시 설명 텍스트 — 추후 입력)',
                imageCount: 23
            },
            {
                id: 'Cabinet', type: 'solo', title: 'Cabinet', year: '2023',
                info: '2023. 1. 17 ~ 2023. 1. 31<br>Sahangup gallery, Seoul, Korea',
                description: '(Cabinet 전시 설명 텍스트 — 추후 입력)',
                imageCount: 14
            },
            // --- Group ---
            {
                id: 'Expanding Horizons', type: 'group', title: 'Expanding Horizons', year: '2026',
                info: '2026. 3. 24 ~ 2026. 5. 30<br>Korean Cultural Center, Hong Kong',
                artists: '(참여 작가 목록 — 추후 입력)',
                imageCount: 7
            },
            {
                id: 'grid 5', type: 'group', title: 'grid 5', year: '2026',
                info: '2026. 3. 21 ~ 2026. 4. 05<br>biscuit gallery, Tokyo, Japan',
                artists: '(참여 작가 목록 — 추후 입력)',
                imageCount: 5
            },
            {
                id: 'Surgical Room', type: 'group', title: 'Surgical Room', year: '2025',
                info: '2025. 5. 17 ~ 2025. 6. 15<br>CYLINDER TWO, Seoul, Korea',
                artists: '(참여 작가 목록 — 추후 입력)',
                imageCount: 6
            },
            {
                id: 'South Parade', type: 'group', title: 'CYLINDER x South Parade', year: '2024',
                info: '2024. 6. 27 ~ 2024. 8. 3<br>South Parade, London, UK',
                artists: '(참여 작가 목록 — 추후 입력)',
                imageCount: 6
            },
            {
                id: 'The Good Neighbor', type: 'group', title: 'The Good Neighbor (좋은이웃)', year: '2023',
                info: '2023. 5. 25 ~ 2023. 6. 10<br>Art Space 3, Seoul',
                artists: '(참여 작가 목록 — 추후 입력)',
                imageCount: 10
            },
            {
                id: 'The Wild Bunch', type: 'group', title: 'The Wild Bunch', year: '2022',
                info: '2022. 9. 28 ~ 2022. 10. 09<br>ThisWeekendRoom, Seoul, Korea',
                artists: '(참여 작가 목록 — 추후 입력)',
                imageCount: 4
            },
            {
                id: 'Fonds', type: 'group', title: 'Fonds', year: '2022',
                info: '2022. 6. 10 ~ 2022. 6. 19<br>Osisun, Seoul, Korea',
                artists: '(참여 작가 목록 — 추후 입력)',
                imageCount: 7
            },
            {
                id: 'Room of Convexity and Concavity', type: 'group', title: 'Room of Convexity and Concavity (철요의 방)', year: '2022',
                info: '2022. 2. 26 ~ 2022. 3. 19<br>LaLaLab, Seoul, Korea',
                artists: '(참여 작가 목록 — 추후 입력)',
                imageCount: 23
            },
            {
                id: 'TORQUE 1', type: 'group', title: 'TORQUE 1 / GEAR SHIFT', year: '2021',
                info: '2021. 2. 11 ~ 2021. 2. 26<br>CYLINDER ONE, Seoul, Korea',
                artists: '(참여 작가 목록 — 추후 입력)',
                imageCount: 4
            },
        ];

        // ===== App Logic =====
        document.addEventListener('DOMContentLoaded', () => {
            const mainView = document.getElementById('main-view');
            const gridEl = document.getElementById('exhibition-grid');
            const galleryView = document.getElementById('gallery-view');
            const galleryTitle = document.getElementById('gallery-title');
            const galleryCounter = document.getElementById('gallery-counter');
            const galleryCaption = document.getElementById('gallery-caption');
            const galleryBack = document.getElementById('gallery-back');
            const galleryPrev = document.getElementById('gallery-prev');
            const galleryNext = document.getElementById('gallery-next');
            const galleryImageArea = document.getElementById('gallery-image-area');
            const galleryTextPage = document.getElementById('gallery-text-page');
            const galleryTextContent = document.getElementById('gallery-text-content');
            const galleryPlaceholder = document.getElementById('gallery-placeholder');
            const galleryImg = document.getElementById('gallery-img');

            let currentExhibition = null;
            let currentIndex = 0; // 0-based across all "slides"
            let totalSlides = 0;

            // --- Build Grid ---
            const solos = exhibitions.filter(e => e.type === 'solo');
            const groups = exhibitions.filter(e => e.type === 'group');

            // Solo label
            const soloLabel = document.createElement('div');
            soloLabel.className = 'section-label';
            soloLabel.textContent = 'Solo Exhibitions';
            gridEl.appendChild(soloLabel);

            // Solo items
            solos.forEach(ex => gridEl.appendChild(createExhibitionCell(ex)));

            // If solo count is odd, add empty cell
            if (solos.length % 2 !== 0) {
                const empty = document.createElement('div');
                empty.className = 'exhibition-item empty-cell';
                empty.innerHTML = '<div class="placeholder-img"></div>';
                gridEl.appendChild(empty);
            }

            // Group label
            const groupLabel = document.createElement('div');
            groupLabel.className = 'section-label';
            groupLabel.textContent = 'Group Exhibitions';
            gridEl.appendChild(groupLabel);

            // Group items
            groups.forEach(ex => gridEl.appendChild(createExhibitionCell(ex)));

            // If group count is odd, add empty cell
            if (groups.length % 2 !== 0) {
                const empty = document.createElement('div');
                empty.className = 'exhibition-item empty-cell';
                empty.innerHTML = '<div class="placeholder-img"></div>';
                gridEl.appendChild(empty);
            }

            function createExhibitionCell(ex) {
                const item = document.createElement('div');
                item.className = 'exhibition-item';
                item.innerHTML = `
                    <div class="placeholder-img">${ex.title} (${ex.year})</div>
                    <div class="exhibition-overlay">
                        <div class="exhibition-overlay-text">
                            <div class="exhibition-overlay-title">${ex.title}</div>
                            <div class="exhibition-overlay-year">${ex.year}</div>
                            <br>
                            <div>${ex.info}</div>
                        </div>
                    </div>
                `;
                item.addEventListener('click', () => openGallery(ex));
                return item;
            }

            // --- Gallery ---
            // Solo: [text page] + [images...]  → totalSlides = 1 + imageCount
            // Group: [images...] + [text page] → totalSlides = imageCount + 1

            function getSlideCount(ex) {
                return ex.imageCount + 1; // +1 for text page
            }

            function isTextSlide(ex, index) {
                if (ex.type === 'solo') return index === 0;
                if (ex.type === 'group') return index === ex.imageCount;
                return false;
            }

            function getImageIndex(ex, slideIndex) {
                // Returns 0-based image index for non-text slides
                if (ex.type === 'solo') return slideIndex - 1;
                return slideIndex;
            }

            function updateGallery() {
                const ex = currentExhibition;
                const total = totalSlides;

                galleryCounter.textContent = `${currentIndex + 1} / ${total}`;
                galleryPrev.classList.toggle('hidden', currentIndex === 0);
                galleryNext.classList.toggle('hidden', currentIndex === total - 1);

                if (isTextSlide(ex, currentIndex)) {
                    // Show text page
                    galleryTextPage.classList.add('active');
                    galleryImageArea.classList.add('hidden');
                    galleryCaption.textContent = '';

                    if (ex.type === 'solo') {
                        galleryTextContent.innerHTML = `
                            <div style="font-size:16px; margin-bottom:20px; font-weight:bold;">${ex.title}</div>
                            <div style="margin-bottom:15px; color:#999;">${ex.info}</div>
                            <div>${ex.description}</div>
                        `;
                    } else {
                        galleryTextContent.innerHTML = `
                            <div style="font-size:16px; margin-bottom:20px; font-weight:bold;">${ex.title}</div>
                            <div style="margin-bottom:15px; color:#999;">${ex.info}</div>
                            <div>${ex.artists}</div>
                        `;
                    }
                } else {
                    // Show image placeholder
                    galleryTextPage.classList.remove('active');
                    galleryImageArea.classList.remove('hidden');
                    const imgIdx = getImageIndex(ex, currentIndex);
                    galleryPlaceholder.textContent = `${ex.title} — Image ${imgIdx + 1} / ${ex.imageCount}`;
                    galleryCaption.textContent = `Caption for image ${imgIdx + 1}`;
                }
            }

            function openGallery(ex) {
                currentExhibition = ex;
                currentIndex = 0;
                totalSlides = getSlideCount(ex);
                galleryTitle.textContent = ex.title;
                updateGallery();
                galleryView.classList.add('active');
                mainView.style.display = 'none';
                document.body.style.overflow = 'hidden';
                history.pushState({ gallery: true }, '', '#' + encodeURIComponent(ex.id));
            }

            function closeGallery() {
                galleryView.classList.remove('active');
                mainView.style.display = '';
                document.body.style.overflow = '';
                if (history.state && history.state.gallery) history.back();
            }

            function navigate(dir) {
                const n = currentIndex + dir;
                if (n >= 0 && n < totalSlides) {
                    currentIndex = n;
                    updateGallery();
                }
            }

            galleryBack.addEventListener('click', closeGallery);
            galleryPrev.addEventListener('click', () => navigate(-1));
            galleryNext.addEventListener('click', () => navigate(1));

            document.addEventListener('keydown', (e) => {
                if (!galleryView.classList.contains('active')) return;
                if (e.key === 'Escape') closeGallery();
                if (e.key === 'ArrowLeft') navigate(-1);
                if (e.key === 'ArrowRight') navigate(1);
            });

            // Mobile tap navigation
            document.querySelector('.gallery-body').addEventListener('click', (e) => {
                if (window.innerWidth > 768) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                if (x < rect.width / 3) navigate(-1);
                else if (x > rect.width * 2 / 3) navigate(1);
            });

            window.addEventListener('popstate', () => {
                if (galleryView.classList.contains('active')) {
                    galleryView.classList.remove('active');
                    mainView.style.display = '';
                    document.body.style.overflow = '';
                }
            });

            // Hamburger
            const hamburger = document.getElementById('hamburger');
            const mobileMenu = document.getElementById('mobile-menu');
            hamburger.addEventListener('click', () => { hamburger.classList.toggle('open'); mobileMenu.classList.toggle('open'); });
            document.querySelectorAll('.mobile-link').forEach(l => l.addEventListener('click', () => { hamburger.classList.remove('open'); mobileMenu.classList.remove('open'); }));
        });
    </script>
</body>
</html>
