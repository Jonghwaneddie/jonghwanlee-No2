<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Jonghwan Lee</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        a { color: inherit; text-decoration: none; cursor: pointer; }
        body {
            font-family: 'Raleway', sans-serif;
            font-size: 13px;
            color: #000;
            line-height: 1.6;
        }
        .fade-text { color: #bbb; }

        .header { position: fixed; top: 0; left: 0; right: 0; padding: 0; background: #fff; z-index: 100; }
        .header-row { height: 50px; display: flex; align-items: center; }
        .header-title { font-size: 13px; font-weight: 300; letter-spacing: 1px; flex-shrink: 0; padding-left: 20px; }
        .header-title a { color: inherit; text-decoration: none; }
        .header-nav { display: flex; align-items: center; justify-content: flex-end; flex: 1; font-size: 12px; font-weight: 200; letter-spacing: 0.5px; }
        .header-nav a { flex: 1; text-align: center; color: #999; text-decoration: none; transition: color 0.2s; }
        .header-nav a:hover { color: #000; }
        .hamburger { display: none; position: absolute; right: 20px; top: 12px; width: 20px; height: 16px; cursor: pointer; flex-direction: column; justify-content: space-between; }
        .hamburger span { display: block; height: 1px; background: #000; transition: transform 0.3s, opacity 0.3s; }
        .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
        .mobile-menu { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fff; z-index: 99; flex-direction: column; align-items: center; justify-content: center; gap: 25px; }
        .mobile-menu.open { display: flex; }
        .mobile-menu a { font-size: 16px; font-weight: 200; color: #000; text-decoration: none; letter-spacing: 1px; transition: opacity 0.2s; }
        .mobile-menu a:hover { opacity: 0.3; }

        .main-view {
            padding: 75px 60px 60px;
            max-width: 1100px;
            margin: 0 auto;
            text-align: left;
        }

        .contact-item {
            margin-bottom: 15px;
        }

        .contact-item a {
            transition: opacity 0.2s;
        }
        .contact-item a:hover {
            opacity: 0.4;
        }

        .copyright {
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            .main-view { padding: 60px 20px 40px; }
            .header-nav { display: none; }
            .hamburger { display: flex; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-row">
            <div class="header-title"><a href="index.html">Jonghwan Lee</a></div>
            <nav class="header-nav">
                <a href="note.html">Notes</a>
                <a href="cv.html">CV</a>
                <a href="works.html">Works</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </header>
    <div class="mobile-menu" id="mobile-menu">
        <a href="note.html" class="mobile-link">Notes</a>
        <a href="cv.html" class="mobile-link">CV</a>
        <a href="works.html" class="mobile-link">Works</a>
        <a href="contact.html" class="mobile-link">Contact</a>
    </div>

    <div class="main-view">
        <div class="contact-item">
            <a href="mailto:enddl1994@gmail.com">enddl1994@gmail.com</a>
        </div>
        <div class="contact-item">
            <a href="https://www.instagram.com/eddi______e" target="_blank">Instagram</a>
        </div>

        <div class="copyright fade-text">
            &copy; 2025. 이종환 Jonghwan Lee All Rights Reserved<br>
            본 웹사이트에 실린 글과 도판은 작가의 동의없이 임의 목적으로 사용할 수 없습니다.
        </div>
    </div>
    <script>
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobile-menu');
        hamburger.addEventListener('click', () => { hamburger.classList.toggle('open'); mobileMenu.classList.toggle('open'); });
        document.querySelectorAll('.mobile-link').forEach(l => l.addEventListener('click', () => { hamburger.classList.remove('open'); mobileMenu.classList.remove('open'); }));
    </script>
</body>
</html>
